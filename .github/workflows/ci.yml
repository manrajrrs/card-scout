name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest
        env:
          ANTHROPIC_API_KEY: test-key
      - run: docker build -t card-scout .